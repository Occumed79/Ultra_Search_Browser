name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply production readiness repairs
        shell: bash
        run: |
          if [ -f scripts/apply-production-fixes.mjs ] && grep -q "existing imports remain at top" src/app/page.tsx; then
            node scripts/apply-production-fixes.mjs
            python - <<'PY'
          from pathlib import Path
          path = Path('src/app/page.tsx')
          source = path.read_text()
          source = source.replace(".join('\n')", ".join('\\n')")
          path.write_text(source)
          PY
          else
            echo "Production readiness repairs already applied."
          fi

      - name: Type-check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail on TypeScript errors
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Production build
        run: npm run build

      - name: Commit verified repairs to PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'finish/production-readiness'
        shell: bash
        run: |
          rm -f typecheck.log
          if [ -f scripts/apply-production-fixes.mjs ]; then
            git rm scripts/apply-production-fixes.mjs
          fi
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app/api/bookmarks/route.ts src/app/api/history/route.ts src/app/bookmarks/page.tsx src/app/page.tsx src/lib/search.ts src/lib/verticals/pricing/config.ts scripts/apply-production-fixes.mjs || true
            git commit -m "Fix strict TypeScript errors and restore search UI"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No generated repairs to commit."
          fi
