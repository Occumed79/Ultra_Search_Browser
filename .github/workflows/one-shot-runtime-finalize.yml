name: One-shot runtime purge finalizer

on:
  push:
    branches:
      - hardening/runtime-import-purge

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/runtime-import-purge
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Require physical purge to have completed
        run: |
          for file in \
            src/lib/automatic-browser-fallback.ts \
            src/lib/brave-search-api.ts \
            src/lib/feature-capabilities.ts \
            src/lib/gemini-grounded-search.ts \
            src/lib/managed-search.ts \
            src/lib/occumed-supplemental-search.ts \
            src/lib/procurement-api-sources.ts \
            src/lib/procurement-browser-rescue-tasks.ts \
            src/lib/procurement-rescue.ts \
            src/lib/public-search-fallbacks.ts \
            src/lib/resilient-search.ts \
            src/lib/sam-gov-opportunities.ts \
            src/lib/search-intent-routing.ts \
            src/lib/search-orchestrator.ts \
            src/lib/search-response-parsers.ts \
            src/lib/tavily-search.ts; do
            if [ -e "$file" ]; then
              echo "Legacy runtime module still exists: $file"
              exit 1
            fi
          done
      - name: Make the regression require zero quarantined modules
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const file = 'scripts/runtime-import-quarantine.test.ts'
          let source = fs.readFileSync(file, 'utf8')
          source = source.replace(
            'assert.equal(report.quarantinedLegacy.length, 16)',
            "assert.equal(report.quarantinedLegacy.length, 0, 'all proven runtime-dead legacy modules must be physically removed')"
          )
          fs.writeFileSync(file, source)
          NODE
          rm -f scripts/purge-runtime-dead.mjs
          rm -f .github/workflows/one-shot-runtime-purge.yml
          rm -f .github/workflows/one-shot-runtime-finalize.yml
      - name: Verify strict runtime graph after purge
        env:
          RUNTIME_IMPORT_AUDIT_STRICT: '1'
        run: node scripts/runtime-import-audit.mjs
      - name: Run search regression suite
        run: |
          npm ci --silent
          npm run test:search
      - name: Commit final purge state
        run: |
          if git diff --quiet; then
            echo 'Final purge state already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize strict runtime dead-code purge'
          git push origin HEAD:hardening/runtime-import-purge
