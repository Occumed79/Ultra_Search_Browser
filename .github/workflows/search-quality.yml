name: Search Quality Lab

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Live Ultra Search URL
        required: true
        default: https://ultra-search-browser.onrender.com
      limit:
        description: Maximum benchmark queries to run
        required: true
        default: '24'
      lenses:
        description: Comma-separated lenses or all
        required: true
        default: all
      strict:
        description: Fail when any query fails or returns zero results
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: search-quality-lab
  cancel-in-progress: true

jobs:
  evaluate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Run live Search Quality Lab
        env:
          APP_URL: ${{ inputs.app_url }}
          QUALITY_LIMIT: ${{ inputs.limit }}
          QUALITY_CONCURRENCY: '2'
          QUALITY_STRICT: ${{ inputs.strict }}
        run: |
          if [ "${{ inputs.lenses }}" != "all" ]; then
            export QUALITY_LENSES="${{ inputs.lenses }}"
          fi
          npm run quality:live

      - name: Publish report summary
        if: always()
        run: |
          if [ -f artifacts/search-quality/search-quality-report.md ]; then
            cat artifacts/search-quality/search-quality-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Search Quality Lab did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-quality-report-${{ github.run_id }}
          path: artifacts/search-quality/
          if-no-files-found: warn
          retention-days: 30
