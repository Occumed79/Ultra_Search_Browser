name: Search Quality Lab

on:
  push:
    branches: [main]
    paths:
      - quality/**
      - src/lib/search-quality.ts
      - scripts/search-quality-live.ts
      - scripts/search-quality.test.ts
      - scripts/wait-for-deployment.mjs
      - .github/workflows/search-quality.yml
  workflow_dispatch:
    inputs:
      app_url:
        description: Live Ultra Search URL
        required: true
        default: https://ultra-search-browser.onrender.com
      limit:
        description: Maximum benchmark queries to run
        required: true
        default: '24'
      lenses:
        description: Comma-separated lenses or all
        required: true
        default: all
      strict:
        description: Fail when any query fails or returns zero results
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write

concurrency:
  group: search-quality-lab
  cancel-in-progress: true

jobs:
  evaluate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Publish pending quality status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"search-quality-baseline\",\"description\":\"Waiting for Render and running quality benchmark\",\"target_url\":\"${TARGET_URL}\"}"

      - name: Install dependencies
        run: npm ci --silent

      - name: Wait for deployed commit
        env:
          APP_URL: ${{ inputs.app_url || 'https://ultra-search-browser.onrender.com' }}
          EXPECTED_COMMIT: ${{ github.sha }}
          MAX_WAIT_MS: '720000'
          POLL_INTERVAL_MS: '15000'
        run: node scripts/wait-for-deployment.mjs

      - name: Run live Search Quality Lab
        id: quality
        continue-on-error: true
        env:
          APP_URL: ${{ inputs.app_url || 'https://ultra-search-browser.onrender.com' }}
          QUALITY_LIMIT: ${{ inputs.limit || '24' }}
          QUALITY_CONCURRENCY: '2'
          QUALITY_STRICT: ${{ inputs.strict || 'false' }}
        run: |
          LENSES="${{ inputs.lenses || 'all' }}"
          if [ "$LENSES" != "all" ]; then
            export QUALITY_LENSES="$LENSES"
          fi
          npm run quality:live

      - name: Publish report summary
        if: always()
        run: |
          if [ -f artifacts/search-quality/search-quality-report.md ]; then
            cat artifacts/search-quality/search-quality-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Search Quality Lab did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-quality-report-${{ github.run_id }}
          path: artifacts/search-quality/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish successful quality status
        if: steps.quality.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"search-quality-baseline\",\"description\":\"Live quality report completed\",\"target_url\":\"${TARGET_URL}\"}"

      - name: Publish failed quality status
        if: steps.quality.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"search-quality-baseline\",\"description\":\"Live quality report failed\",\"target_url\":\"${TARGET_URL}\"}"

      - name: Fail workflow when quality evaluation failed
        if: steps.quality.outcome != 'success'
        run: exit 1

  summarize-quality:
    needs: evaluate-production
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download quality report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: search-quality-report-*
          path: report
          merge-multiple: true

      - name: Print compact quality diagnostics
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'report/search-quality-report.json'
          if (!fs.existsSync(path)) {
            console.log('QUALITY_REPORT_MISSING')
            process.exit(0)
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'))
          console.log('QUALITY_SUMMARY ' + JSON.stringify(report.summary))
          const failures = (report.reports || []).filter(item => item.status === 'failed').slice(0, 8)
          for (const item of failures) {
            console.log(`QUALITY_FAILURE ${item.id}: ${item.error || 'unknown failure'}`)
          }
          const zeroes = (report.reports || []).filter(item => item.status === 'success' && item.evaluation?.resultCount === 0).slice(0, 8)
          for (const item of zeroes) {
            console.log(`QUALITY_ZERO_RESULTS ${item.id}`)
          }
          NODE
