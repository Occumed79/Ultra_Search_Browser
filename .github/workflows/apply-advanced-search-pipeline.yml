name: Apply advanced search pipeline patch

on:
  push:
    branches:
      - advanced-search-pipeline
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-advanced-search-pipeline
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.ref == 'refs/heads/advanced-search-pipeline' || github.head_ref == 'advanced-search-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: advanced-search-pipeline
          fetch-depth: 0

      - name: Reconstruct and inspect patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/advanced-pipeline
          {
            echo "Staged chunk byte counts:"
            wc -c .tmp/advanced-pipeline/part-*.b64
          } > .tmp/advanced-pipeline/diagnostic.txt
          cat .tmp/advanced-pipeline/part-*.b64 > /tmp/ultra-advanced-pipeline.b64
          base64 --decode /tmp/ultra-advanced-pipeline.b64 > /tmp/ultra-advanced-pipeline.patch
          {
            echo
            echo "Reconstructed files:"
            wc -c /tmp/ultra-advanced-pipeline.b64 /tmp/ultra-advanced-pipeline.patch
            echo
            echo "Patch SHA-256:"
            sha256sum /tmp/ultra-advanced-pipeline.patch
            echo
            echo "Dry-run output:"
          } >> .tmp/advanced-pipeline/diagnostic.txt
          patch -p1 --dry-run < /tmp/ultra-advanced-pipeline.patch >> .tmp/advanced-pipeline/diagnostic.txt 2>&1

      - name: Apply patch
        shell: bash
        run: patch -p1 < /tmp/ultra-advanced-pipeline.patch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .tmp/advanced-pipeline/typecheck.log

      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .tmp/advanced-pipeline/build.log

      - name: Commit completed implementation and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/advanced-pipeline .tmp/test.txt
          rm -f .github/workflows/apply-advanced-search-pipeline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconnect staged advanced search pipeline"
          git push origin HEAD:advanced-search-pipeline

      - name: Commit diagnostics when validation fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/advanced-pipeline/diagnostic.txt .tmp/advanced-pipeline/typecheck.log .tmp/advanced-pipeline/build.log 2>/dev/null || true
          git commit -m "Record advanced pipeline validation diagnostics" || true
          git push origin HEAD:advanced-search-pipeline || true
