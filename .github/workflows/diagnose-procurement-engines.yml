name: Diagnose procurement search engines

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-procurement-engines.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/expand-procurement-fallback
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Query additional public search engines
        shell: bash
        run: |
          cat > /tmp/diagnose.ts <<'TS'
          import { searchYahooHtml, searchBraveHtml, searchMojeekHtml } from '$GITHUB_WORKSPACE/src/lib/public-search-fallbacks'

          async function main() {
            const queries = [
              '"Occupational Health Services" (RFP OR RFQ OR solicitation OR bid) 2026',
              'intitle:RFP "Occupational Health Services"',
              'site:.gov "Occupational Health Services" (RFP OR RFQ OR solicitation)',
              'filetype:pdf "Occupational Health Services" ("request for proposals" OR RFP OR RFQ)',
            ]
            const engines = [
              ['Yahoo', searchYahooHtml],
              ['Brave', searchBraveHtml],
              ['Mojeek', searchMojeekHtml],
            ] as const

            const runs = queries.flatMap(query => engines.map(async ([name, search]) => {
              try {
                const response = await search(query, { safeSearch: true, preferredLanguage: 'en', region: 'us' })
                return { query, name, results: response.results.slice(0, 12), error: '' }
              } catch (error) {
                return { query, name, results: [], error: error instanceof Error ? error.message : String(error) }
              }
            }))

            for (const run of await Promise.all(runs)) {
              console.log(`\n=== ${run.name} | ${run.query} ===`)
              if (run.error) console.log(`ERROR: ${run.error}`)
              console.log(`RESULTS: ${run.results.length}`)
              for (const result of run.results) console.log(`- ${result.title} | ${result.url}`)
            }
          }

          main().catch(error => {
            console.error(error)
            process.exitCode = 1
          })
          TS
          sed -i "s|\$GITHUB_WORKSPACE|$GITHUB_WORKSPACE|g" /tmp/diagnose.ts
          npx tsx /tmp/diagnose.ts
