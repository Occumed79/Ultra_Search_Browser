name: Verify Next.js build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/build-verified.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Record successful build
        run: |
          printf 'Verified commit: %s\n' "$GITHUB_SHA" > .github/build-verified.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/build-verified.txt
          git commit -m "Record successful Ultra Search build" || exit 0
          git push
