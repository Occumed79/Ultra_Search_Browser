name: Apply settings search wiring

on:
  push:
    branches:
      - settings-search-wiring

permissions:
  contents: write

concurrency:
  group: settings-search-wiring
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: settings-search-wiring
          fetch-depth: 0

      - name: Apply implementation
        run: python .tmp/apply-settings-search.py

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Settings and search tests
        run: npm run test:settings

      - name: Production build
        run: npm run build

      - name: Commit completed implementation
        run: |
          rm -rf .tmp
          rm -f .github/workflows/apply-settings-search-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire settings into search behavior"
          git push origin HEAD:settings-search-wiring
