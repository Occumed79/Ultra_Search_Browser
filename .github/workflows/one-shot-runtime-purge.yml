name: One-shot runtime dead-code purge

on:
  push:
    branches:
      - hardening/runtime-import-purge

permissions:
  contents: write

jobs:
  purge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/runtime-import-purge
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Prove and remove runtime-dead modules
        run: |
          node scripts/runtime-import-audit.mjs
          node scripts/purge-runtime-dead.mjs | tee runtime-purge.json
          rm -f .github/workflows/one-shot-runtime-purge.yml
      - name: Verify no unexpected runtime-dead source remains
        env:
          RUNTIME_IMPORT_AUDIT_STRICT: '1'
        run: node scripts/runtime-import-audit.mjs --json | tee runtime-import-after-purge.json
      - name: Commit purge back to hardening branch
        run: |
          if git diff --quiet; then
            echo 'Nothing to purge.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove proven runtime-dead legacy search modules'
          git push origin HEAD:hardening/runtime-import-purge
