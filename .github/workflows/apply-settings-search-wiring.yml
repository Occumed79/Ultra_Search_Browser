name: Apply settings search wiring

on:
  push:
    branches:
      - settings-search-wiring
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: settings-search-wiring
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: settings-search-wiring
          fetch-depth: 0

      - name: Apply implementation
        id: apply
        continue-on-error: true
        run: |
          python .tmp/hotfix-settings-script.py
          python .tmp/apply-settings-search.py > .tmp/apply.log 2>&1

      - name: Upload apply diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-search-apply-log
          path: .tmp/apply.log

      - name: Stop on apply failure
        if: steps.apply.outcome == 'failure'
        run: |
          cat .tmp/apply.log
          exit 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Settings and search tests
        run: npm run test:settings

      - name: Production build
        run: npm run build

      - name: Commit validated product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts package.json
          git commit -m "Wire settings into search behavior"
          git push origin HEAD:settings-search-wiring
