name: Apply SAM.gov procurement source

on:
  pull_request:
    branches:
      - main
    paths:
      - src/lib/sam-gov-opportunities.ts
      - src/lib/procurement-rescue.ts
      - src/lib/procurement-rescue-queries.ts
      - src/app/api/health/route.ts
      - scripts/sam-gov-opportunities.test.ts
      - .github/workflows/apply-sam-gov-procurement-source.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sam-gov-procurement-source
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Update production smoke pipeline marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/production-smoke.mjs')
          text = path.read_text()
          old = "health.searchPipeline === 'orchestrated-v10-browser-search-fallback'"
          new = "health.searchPipeline === 'orchestrated-v11-sam-gov-procurement'"
          if old not in text:
              raise SystemExit('Expected production pipeline marker was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run complete search tests
        run: npm run test:search

      - name: Build production bundle
        run: npm run build

      - name: Commit verified source
        shell: bash
        run: |
          rm .github/workflows/apply-sam-gov-procurement-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Search SAM.gov for procurement opportunities"
          git push origin HEAD:fix/sam-gov-procurement-source
