name: Production Search Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-search-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish pending production status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"production-search-smoke\",\"description\":\"Waiting for Render and testing the zero-key live search path\",\"target_url\":\"${TARGET_URL}\"}"

      - name: Wait for Render and test zero-key live search path
        id: smoke
        continue-on-error: true
        env:
          APP_URL: https://ultra-search-browser.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
          MAX_WAIT_MS: 720000
          POLL_INTERVAL_MS: 15000
        shell: bash
        run: |
          set +e
          node scripts/production-smoke.mjs 2>&1 | tee production-smoke.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            node scripts/production-user-flow-smoke.mjs 2>&1 | tee -a production-smoke.log
            status=${PIPESTATUS[0]}
          fi
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload production smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: production-smoke.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish successful production status
        if: steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"production-search-smoke\",\"description\":\"Render serves this commit and live zero-key search checks passed\",\"target_url\":\"${TARGET_URL}\"}"

      - name: Publish failed production status
        if: steps.smoke.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"production-search-smoke\",\"description\":\"Render deployment or live zero-key search verification failed\",\"target_url\":\"${TARGET_URL}\"}"

      - name: Fail workflow when production verification failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
