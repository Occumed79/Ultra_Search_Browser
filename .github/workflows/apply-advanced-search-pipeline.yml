name: Apply advanced search pipeline patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-advanced-search-pipeline
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.head_ref == 'advanced-search-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: advanced-search-pipeline
          fetch-depth: 0

      - name: Reconstruct and inspect patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/advanced-pipeline
          {
            echo "Staged chunk byte counts:"
            wc -c .tmp/advanced-pipeline/part-*.b64
          } > .tmp/advanced-pipeline/diagnostic.txt
          cat .tmp/advanced-pipeline/part-*.b64 > /tmp/ultra-advanced-pipeline.b64
          base64 --decode /tmp/ultra-advanced-pipeline.b64 > /tmp/ultra-advanced-pipeline.patch
          cp /tmp/ultra-advanced-pipeline.patch .tmp/advanced-pipeline/reconstructed.patch
          {
            echo
            echo "Reconstructed files:"
            wc -c /tmp/ultra-advanced-pipeline.b64 /tmp/ultra-advanced-pipeline.patch
            echo
            echo "Patch SHA-256:"
            sha256sum /tmp/ultra-advanced-pipeline.patch
            echo
            echo "Dry-run output:"
          } >> .tmp/advanced-pipeline/diagnostic.txt
          patch -p1 --dry-run < /tmp/ultra-advanced-pipeline.patch >> .tmp/advanced-pipeline/diagnostic.txt 2>&1

      - name: Apply patch
        shell: bash
        run: patch -p1 < /tmp/ultra-advanced-pipeline.patch

      - name: Snapshot applied files
        shell: bash
        run: |
          mkdir -p .tmp/advanced-pipeline/applied/src/app/api/search/enrich
          mkdir -p .tmp/advanced-pipeline/applied/src/app/api/search
          mkdir -p .tmp/advanced-pipeline/applied/src/app
          mkdir -p .tmp/advanced-pipeline/applied/src/hooks
          mkdir -p .tmp/advanced-pipeline/applied/src/types
          cp src/app/api/search/enrich/route.ts .tmp/advanced-pipeline/applied/src/app/api/search/enrich/route.ts
          cp src/app/api/search/route.ts .tmp/advanced-pipeline/applied/src/app/api/search/route.ts
          cp src/app/page.tsx .tmp/advanced-pipeline/applied/src/app/page.tsx
          cp src/hooks/use-search.ts .tmp/advanced-pipeline/applied/src/hooks/use-search.ts
          cp src/types/search.ts .tmp/advanced-pipeline/applied/src/types/search.ts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee .tmp/advanced-pipeline/typecheck.log

      - name: Production build
        id: build
        if: steps.typecheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .tmp/advanced-pipeline/build.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-pipeline-validation
          path: .tmp/advanced-pipeline
          if-no-files-found: error

      - name: Fail when validation did not pass
        if: steps.typecheck.outcome != 'success' || steps.build.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Commit completed implementation and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/advanced-pipeline .tmp/test.txt
          rm -f .github/workflows/apply-advanced-search-pipeline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconnect staged advanced search pipeline"
          git push origin HEAD:advanced-search-pipeline
