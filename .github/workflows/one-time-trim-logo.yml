name: One-time trim brand logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  trim-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Trim transparent padding from logo
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path('public/brand/logo.png')
          image = Image.open(path).convert('RGBA')
          alpha = image.getchannel('A')
          bbox = alpha.getbbox()
          if not bbox:
              raise SystemExit('Logo is fully transparent')

          padding = 20
          left = max(0, bbox[0] - padding)
          top = max(0, bbox[1] - padding)
          right = min(image.width, bbox[2] + padding)
          bottom = min(image.height, bbox[3] + padding)
          cropped = image.crop((left, top, right, bottom))
          cropped.save(path, optimize=True)
          print(f'Trimmed logo from {image.size} to {cropped.size}')
          PY

      - name: Commit trimmed logo and remove temporary workflow
        run: |
          rm -f .github/workflows/one-time-trim-logo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/logo.png .github/workflows/one-time-trim-logo.yml
          git commit -m "Trim transparent padding from brand logo"
          git push origin main
