name: Cleanup duplicate headers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove duplicate page headers
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          layout = root / 'src/app/layout.tsx'
          text = layout.read_text()
          text = text.replace('          <div className="[&>div>header]:hidden">{children}</div>', '          {children}')
          layout.write_text(text)

          home = root / 'src/app/page.tsx'
          text = home.read_text()
          text = text.replace('  Bookmark,\n', '').replace('  Settings,\n', '')
          text = re.sub(
              r'\n      <header className="relative z-10 flex items-center justify-between px-6 py-5">.*?</header>\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          home.write_text(text)

          history = root / 'src/app/history/page.tsx'
          text = history.read_text()
          for token in ('  Bookmark,\n', '  Clock3,\n', '  Settings,\n'):
              text = text.replace(token, '')
          text = re.sub(
              r'\n      <header className="relative z-10 flex items-center justify-between px-6 py-5">.*?</header>\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          history.write_text(text)

          settings = root / 'src/app/settings/page.tsx'
          text = settings.read_text()
          text = text.replace('import { Header } from "../../components/header";\n', '')
          text = text.replace('      <Header />\n\n', '')
          settings.write_text(text)

          workflow = root / '.github/workflows/cleanup-duplicate-headers.yml'
          workflow.unlink()
          PY
      - name: Verify build
        run: npm install && npm run build
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Delete duplicate page headers and use shared app header"
          git push
