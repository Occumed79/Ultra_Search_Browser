name: Apply Gemini grounded search fallback retry

on:
  pull_request:
    branches:
      - main
    paths:
      - src/lib/gemini-grounded-search.ts
      - scripts/gemini-grounded-search.test.ts
      - scripts/apply-gemini-grounded-integration.py
      - .github/workflows/apply-gemini-grounded-fallback-retry.yml

permissions:
  contents: write

jobs:
  integrate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gemini-grounded-search-fallback
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Integrate grounded fallback into production search
        run: python scripts/apply-gemini-grounded-integration.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run complete search tests
        run: npm run test:search

      - name: Build production bundle
        run: npm run build

      - name: Commit verified integration
        shell: bash
        run: |
          rm scripts/apply-gemini-grounded-integration.py
          rm .github/workflows/apply-gemini-grounded-fallback-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use Gemini Google Search when provider keys are unavailable"
          git push origin HEAD:fix/gemini-grounded-search-fallback
