name: Keep Render Services Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keep-awake
  cancel-in-progress: true

jobs:
  ping-render-services:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Ping Render health endpoints
        env:
          EXTRA_RENDER_URLS: ${{ vars.RENDER_KEEP_AWAKE_URLS }}
        shell: bash
        run: |
          set -uo pipefail

          targets_file="$(mktemp)"
          unique_targets_file="$(mktemp)"

          cat > "$targets_file" <<'EOF'
          # Ultra Search Browser
          https://ultra-search-browser.onrender.com/api/health

          # Network and atlas apps
          https://network-map-tool-mqib.onrender.com/api/health
          https://service-map-atlas-final.onrender.com/api/health

          # Search and intelligence apps
          https://international-search.onrender.com/
          https://insight-hub-eyza.onrender.com/api/health
          https://insight-hub2-0-fz26.onrender.com/api/healthz
          https://occu-med-insight-hub.onrender.com/api/healthz
          https://price-search-tool.onrender.com/
          https://price-search-api.onrender.com/api/healthz
          https://provider-intelligence-hub-api.onrender.com/api/healthz
          https://hiring-trend-dashboard.onrender.com/api/health

          # Employee, assessment, and workflow apps
          https://employee-lookup.onrender.com/api/health
          https://employee-lookup-api.onrender.com/api/health
          https://human-systems-intelligence.onrender.com/api/health
          https://exam-review-report.onrender.com/
          https://packetpath-docusign-replacement.onrender.com/api/health

          # Operations and document apps
          https://lab-supplies-order-api.onrender.com/health
          https://pricing-agreement-generator.onrender.com/
          https://source-vault.onrender.com/
          EOF

          if [[ -n "${EXTRA_RENDER_URLS:-}" ]]; then
            printf '%s\n' "$EXTRA_RENDER_URLS" \
              | tr ', ' '\n\n' \
              | sed '/^[[:space:]]*$/d' \
              >> "$targets_file"
          fi

          sed 's/^[[:space:]]*//;s/[[:space:]]*$//' "$targets_file" \
            | sed '/^$/d;/^#/d' \
            | sort -u \
            > "$unique_targets_file"

          ping_url() {
            local url="$1"
            echo "Pinging ${url}"

            if curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --max-time 55 \
              --retry 2 \
              --retry-delay 5 \
              --retry-all-errors \
              --user-agent "Occu-Med-Render-Keep-Awake/2.0" \
              "$url" \
              > /dev/null; then
              echo "Healthy: ${url}"
            else
              echo "::warning::Ping failed for ${url}; the inbound request was still attempted."
            fi
          }

          export -f ping_url

          # Run a few requests concurrently so one cold or unavailable service
          # cannot delay the rest of the keep-awake cycle.
          xargs -r -P 6 -n 1 bash -c 'ping_url "$1"' _ < "$unique_targets_file" || true
