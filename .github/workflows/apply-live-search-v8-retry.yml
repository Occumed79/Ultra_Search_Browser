name: Apply live search v8 hotfix retry

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-live-search-v8.yml
      - .github/workflows/apply-live-search-v8-retry.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-search-v8
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply exact source patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_lines(path: str, old_lines: list[str], new_lines: list[str]) -> None:
              file = Path(path)
              text = file.read_text()
              old = '\n'.join(old_lines)
              new = '\n'.join(new_lines)
              if old not in text:
                  raise SystemExit(f'Expected patch target missing in {path}: {old[:160]!r}')
              file.write_text(text.replace(old, new, 1))

          replace_lines('src/lib/managed-search.ts', [
              'export type ManagedSearchProvider =',
              "  | 'serper'",
              "  | 'exa'",
              "  | 'langsearch'",
              "  | 'firecrawl'",
              "  | 'olostep'",
          ], [
              'export type ManagedSearchProvider =',
              "  | 'serper'",
              "  | 'you'",
              "  | 'parallel'",
              "  | 'linkup'",
              "  | 'exa'",
              "  | 'langsearch'",
              "  | 'firecrawl'",
              "  | 'olostep'",
          ])

          replace_lines('src/lib/managed-search.ts', [
              '  {',
              "    provider: 'serper',",
              "    label: 'Serper',",
              "    environmentVariable: 'SERPER_API_KEY',",
              "    endpoint: 'https://google.serper.dev/search',",
              '  },',
              '  {',
              "    provider: 'exa',",
          ], [
              '  {',
              "    provider: 'serper',",
              "    label: 'Serper',",
              "    environmentVariable: 'SERPER_API_KEY',",
              "    endpoint: 'https://google.serper.dev/search',",
              '  },',
              '  {',
              "    provider: 'you',",
              "    label: 'You.com',",
              "    environmentVariable: 'YOU_API_KEY',",
              "    endpoint: 'https://ydc-index.io/v1/search',",
              '  },',
              '  {',
              "    provider: 'parallel',",
              "    label: 'Parallel',",
              "    environmentVariable: 'PARALLEL_API_KEY',",
              "    endpoint: 'https://api.parallel.ai/v1/search',",
              '  },',
              '  {',
              "    provider: 'linkup',",
              "    label: 'Linkup',",
              "    environmentVariable: 'LINKUP_API_KEY',",
              "    endpoint: 'https://api.linkup.so/v1/search',",
              '  },',
              '  {',
              "    provider: 'exa',",
          ])

          replace_lines('src/lib/managed-search.ts', [
              'function configuredKeys(',
              '  environmentVariable: string,',
              '  environment: ManagedSearchEnvironment',
              '): string[] {',
              "  const pluralVariable = environmentVariable.replace(/_KEY$/, '_KEYS')",
              '  const names = [',
              '    environmentVariable,',
              '    `${environmentVariable}_SECONDARY`,',
              '    `${environmentVariable}_TERTIARY`,',
              '    `${environmentVariable}_QUATERNARY`,',
              '    ...Array.from({ length: 10 }, (_, index) => `${environmentVariable}_${index + 2}`),',
              '  ]',
              '  const values = [',
              "    ...names.map(name => environment[name] || ''),",
              "    ...(environment[pluralVariable] || '').split(/[\\n,;]/),",
              '  ]',
              '  return unique(values.map(value => value.trim()))',
              '}',
          ], [
              'function configuredKeys(',
              '  environmentVariable: string,',
              '  environment: ManagedSearchEnvironment',
              '): string[] {',
              "  const baseVariables = environmentVariable === 'YOU_API_KEY'",
              "    ? [environmentVariable, 'YDC_API_KEY']",
              '    : [environmentVariable]',
              '  const names = baseVariables.flatMap(baseVariable => [',
              '    baseVariable,',
              '    `${baseVariable}_SECONDARY`,',
              '    `${baseVariable}_TERTIARY`,',
              '    `${baseVariable}_QUATERNARY`,',
              '    ...Array.from({ length: 10 }, (_, index) => `${baseVariable}_${index + 2}`),',
              '  ])',
              "  const pluralVariables = baseVariables.map(baseVariable => baseVariable.replace(/_KEY$/, '_KEYS'))",
              '  const values = [',
              "    ...names.map(name => environment[name] || ''),",
              "    ...pluralVariables.flatMap(name => (environment[name] || '').split(/[\\n,;]/)),",
              '  ]',
              '  return unique(values.map(value => value.trim()))',
              '}',
          ])

          replace_lines('src/lib/managed-search.ts', [
              '  const webPages = asRecord(data.webPages || root.webPages)',
              '  const result = asRecord(root.result)',
              '',
              "  if (provider === 'serper') return asArray(root.organic)",
              "  if (provider === 'exa') return asArray(root.results)",
              "  if (provider === 'langsearch') {",
          ], [
              '  const webPages = asRecord(data.webPages || root.webPages)',
              '  const result = asRecord(root.result)',
              '  const unifiedResults = asRecord(root.results)',
              '',
              "  if (provider === 'serper') return asArray(root.organic)",
              "  if (provider === 'you') return [...asArray(unifiedResults.web), ...asArray(unifiedResults.news)]",
              "  if (provider === 'parallel' || provider === 'linkup' || provider === 'exa') return asArray(root.results)",
              "  if (provider === 'langsearch') {",
          ])

          replace_lines('src/lib/managed-search.ts', [
              '          record.content,',
              '          record.highlights,',
              '          record.text',
          ], [
              '          record.content,',
              '          record.excerpts,',
              '          record.snippets,',
              '          record.highlights,',
              '          record.text',
          ])

          replace_lines('src/lib/managed-search.ts', [
              "  if (definition.provider === 'exa') {",
              '    return {',
              "      headers: { 'x-api-key': key, 'Content-Type': 'application/json' },",
          ], [
              "  if (definition.provider === 'you') {",
              '    return {',
              "      headers: { 'X-API-Key': key, 'Content-Type': 'application/json' },",
              '      body: {',
              '        query,',
              '        count: limit,',
              '        country: region.toUpperCase(),',
              '        language: language.toUpperCase(),',
              "        safesearch: options.safeSearch ? 'strict' : 'moderate',",
              '      },',
              '    }',
              '  }',
              "  if (definition.provider === 'parallel') {",
              '    return {',
              "      headers: { 'x-api-key': key, 'Content-Type': 'application/json' },",
              '      body: {',
              '        objective: query,',
              '        search_queries: [query],',
              '        max_chars_total: Math.max(8_000, limit * 800),',
              '      },',
              '    }',
              '  }',
              "  if (definition.provider === 'linkup') {",
              '    return {',
              "      headers: { Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },",
              '      body: {',
              '        q: query,',
              "        depth: 'standard',",
              "        outputType: 'searchResults',",
              '        maxResults: limit,',
              '      },',
              '    }',
              '  }',
              "  if (definition.provider === 'exa') {",
              '    return {',
              "      headers: { 'x-api-key': key, 'Content-Type': 'application/json' },",
          ])

          replace_lines('src/lib/managed-search.ts', [
              '  const providerOffset = stableHash(query) % definitions.length',
              '  const ordered = [...definitions.slice(providerOffset), ...definitions.slice(0, providerOffset)]',
              '  const primary = ordered.slice(0, Math.min(PRIMARY_PROVIDER_COUNT, ordered.length))',
              '  const fallbacks = ordered.slice(primary.length)',
              '  const queries = unique([query, ...(options.queryVariants || [])]).slice(0, 4)',
              '  const queryFor = (provider: ProviderDefinition, index: number) =>',
              '    queries[(stableHash(provider.provider) + index) % queries.length] || query',
          ], [
              "  // Always send the user's complete query to the primary indexes. The former",
              '  // hash-based assignment could send every configured provider a different expansion',
              '  // while never sending the literal request that the user typed.',
              '  const ordered = definitions',
              '  const primary = ordered.slice(0, Math.min(PRIMARY_PROVIDER_COUNT, ordered.length))',
              '  const fallbacks = ordered.slice(primary.length)',
              '  const queries = unique([query, ...(options.queryVariants || [])]).slice(0, 4)',
              '  const queryFor = (_provider: ProviderDefinition, index: number) =>',
              '    index < primary.length',
              '      ? query',
              '      : queries[(index - primary.length) % queries.length] || query',
          ])

          replace_lines('src/hooks/use-search.ts', [
              '    setValidationProgress(null)',
              '    setEnrichmentError(null)',
              '    setError(null)',
              '    const startTime = performance.now()',
          ], [
              '    setValidationProgress(null)',
              '    setEnrichmentError(null)',
              '    setError(null)',
              '    setIntelligence(null)',
              '    setSuggestions([])',
              '    setHasSearched(false)',
              '    setSearchTime(0)',
              '    const startTime = performance.now()',
          ])

          replace_lines('src/hooks/use-search.ts', [
              '    } catch (searchError) {',
              '      if (searchSequence.current === sequence) {',
              "        setError(searchError instanceof Error ? searchError.message : 'Search failed')",
              '      }',
              '    } finally {',
          ], [
              '    } catch (searchError) {',
              '      if (searchSequence.current === sequence) {',
              '        setIntelligence(null)',
              '        setScrapedResults([])',
              '        setResultBuckets(EMPTY_BUCKETS)',
              '        setValidationProgress(null)',
              '        setSuggestions([])',
              '        setHasSearched(true)',
              '        setSearchTime(performance.now() - startTime)',
              "        setError(searchError instanceof Error ? searchError.message : 'Search failed')",
              '      }',
              '    } finally {',
          ])

          replace_lines('src/app/page.tsx', [
              '            {!isLoading && visibleResults.length === 0 && (',
              '              <div className="py-12 text-center text-sm text-white/40">No ranked results found.</div>',
              '            )}',
          ], [
              '            {!isLoading && !error && visibleResults.length === 0 && (',
              '              <div className="py-12 text-center text-sm text-white/40">No ranked results found.</div>',
              '            )}',
          ])

          replace_lines('src/app/api/search/route.ts', [
              '    if (orchestration.results.length === 0 && noExternalResults && orchestration.failures.length > 0) {',
              '      return NextResponse.json(',
          ], [
              '    if (orchestration.results.length === 0 && noExternalResults && orchestration.failures.length > 0) {',
              '      const failureSummary = orchestration.diagnostics.sourceRuns',
              "        .filter(run => run.status === 'failed')",
              '        .slice(0, 6)',
              "        .map(run => `${run.source}: ${run.error || 'request failed'}`)",
              "        .join('; ')",
              '      return NextResponse.json(',
          ])

          replace_lines('src/app/api/search/route.ts', [
              "          detail: 'The selected web sources were blocked, timed out, or returned unreadable search pages. This is a retrieval failure, not a legitimate zero-result search.',",
          ], [
              '          detail: failureSummary',
              '            ? `Every configured search provider failed. ${failureSummary}`',
              "            : 'Every configured search provider failed before returning usable results.',",
          ])

          for path in ['src/app/api/health/route.ts', 'scripts/production-smoke.mjs']:
              file = Path(path)
              text = file.read_text()
              old = 'orchestrated-v7-managed-api-metasearch'
              if old not in text:
                  raise SystemExit(f'Expected pipeline marker missing in {path}')
              file.write_text(text.replace(old, 'orchestrated-v8-multi-api-failover'))

          test_file = Path('scripts/managed-search.test.ts')
          test_text = test_file.read_text()
          marker = "test('You.com, Parallel, and Linkup use their production API contracts'"
          if marker not in test_text:
              test_text += r'''

          test('You.com, Parallel, and Linkup use their production API contracts', async () => {
            const environment: ManagedSearchEnvironment = {
              YOU_API_KEY: 'you-key',
              PARALLEL_API_KEY: 'parallel-key',
              LINKUP_API_KEY: 'linkup-key',
            }
            const requests: Array<{ endpoint: string; headers: Headers; body: Record<string, unknown> }> = []
            const fetchFn = async (input: string | URL | Request, init?: RequestInit) => {
              const endpoint = String(input)
              const headers = new Headers(init?.headers)
              const body = JSON.parse(String(init?.body || '{}')) as Record<string, unknown>
              requests.push({ endpoint, headers, body })

              if (endpoint.includes('ydc-index.io')) {
                return jsonResponse({
                  results: {
                    web: [{
                      title: 'Occupational Health Services RFP',
                      url: 'https://you.example/rfp',
                      description: 'Request for proposals for occupational health services.',
                      snippets: ['Occupational health solicitation.'],
                    }],
                    news: [],
                  },
                })
              }
              if (endpoint.includes('parallel.ai')) {
                return jsonResponse({
                  results: [{
                    title: 'Employee Medical Services Bid',
                    url: 'https://parallel.example/bid',
                    excerpts: ['Bid for employee medical evaluation services.'],
                  }],
                })
              }
              return jsonResponse({
                results: [{
                  name: 'Pre-Employment Examination Solicitation',
                  url: 'https://linkup.example/solicitation',
                  content: 'Solicitation for pre-employment examinations.',
                }],
              })
            }

            const search = await searchManagedWeb(
              'occupational health services RFP',
              { safeSearch: true, preferredLanguage: 'en', region: 'us' },
              environment,
              fetchFn
            )

            assert.equal(search.results.length, 3)
            assert.deepEqual(
              new Set(search.results.map(result => result.source)),
              new Set(['You.com', 'Parallel', 'Linkup'])
            )
            assert.equal(requests.find(request => request.endpoint.includes('ydc-index.io'))?.headers.get('X-API-Key'), 'you-key')
            assert.equal(requests.find(request => request.endpoint.includes('parallel.ai'))?.headers.get('x-api-key'), 'parallel-key')
            assert.equal(requests.find(request => request.endpoint.includes('linkup.so'))?.headers.get('Authorization'), 'Bearer linkup-key')
            assert.equal(requests.find(request => request.endpoint.includes('ydc-index.io'))?.body.query, 'occupational health services RFP')
            assert.deepEqual(requests.find(request => request.endpoint.includes('parallel.ai'))?.body.search_queries, ['occupational health services RFP'])
            assert.equal(requests.find(request => request.endpoint.includes('linkup.so'))?.body.outputType, 'searchResults')
          })
          '''
              test_file.write_text(test_text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run search tests
        run: npm run test:search

      - name: Build production bundle
        run: npm run build

      - name: Commit verified hotfix
        shell: bash
        run: |
          rm -f .github/workflows/apply-live-search-v8.yml
          rm -f .github/workflows/apply-live-search-v8-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix live multi-provider search and stale failure state"
          git push origin HEAD:fix/live-search-v8
