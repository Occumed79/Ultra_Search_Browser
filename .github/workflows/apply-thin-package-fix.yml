name: Apply thin package validator fix

on:
  push:
    branches:
      - fix/deep-validation-thin-package

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/deep-validation-thin-package
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply validator patch
        run: node scripts/apply-thin-package-fix.mjs

      - name: Remove one-time patch machinery
        run: |
          rm scripts/apply-thin-package-fix.mjs
          rm .github/workflows/apply-thin-package-fix.yml

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/page-validation.ts scripts/apply-thin-package-fix.mjs .github/workflows/apply-thin-package-fix.yml
          git commit -m "Inspect linked solicitation packages before rejecting thin pages"
          git push origin HEAD:fix/deep-validation-thin-package
