name: Production Search Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-search-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Render and test live search
        env:
          APP_URL: https://ultra-search-browser.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
          MAX_WAIT_MS: 720000
          POLL_INTERVAL_MS: 15000
        run: node scripts/production-smoke.mjs
